name: Agent tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CREWAI_TELEMETRY_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install pytest build './packages/langchain[langchain]' ./packages/crewai ./packages/composio
      - run: python -m pytest tests strategies/tests -q
      - run: npm install --prefix packages/npm --ignore-scripts --no-audit --no-fund --no-save --package-lock=false @langchain/core@1.3.5 zod@4
      - run: node tests/node.mjs
      - run: |
          python -m build packages/langchain
          python -m build packages/crewai
          python -m build packages/composio
          npm pack --dry-run ./packages/npm
